<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff;touch-action:none}

 <div id="wrap">

 </div>

<script>
(()=>{
const W=320,H=180,SH=158;
const $=id=>document.getElementById(id);
const cv=$('c'),wrap=$('wrap');cv.width=W;cv.height=H;
const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const rnd=n=>Math.floor(Math.random()*n);
function fit(){
 const ww=window.innerWidth,wh=window.innerHeight;
 let w=ww,h=ww*H/W;if(h>wh){h=wh;w=wh*W/H;}
 wrap.style.width=w+'px';wrap.style.height=h+'px';wrap.style.fontSize=Math.max(10,h/28)+'px';
}
window.addEventListener('resize',fit);fit();
const HOUR=45;
const LV=[null,
 {b:3,o:2,p:1,m:0,t:0,s:0},
 {b:5,o:4,p:3,m:4,t:0,s:0},
 {b:6,o:6,p:5,m:7,t:5,s:0},
 {b:9,o:8,p:8,m:10,t:8,s:6},
 {b:12,o:12,p:12,m:13,t:12,s:12}];
const HRS=['12 AM','1 AM','2 AM','3 AM','4 AM','5 AM','6 AM'];
const NAMES={b:'Bobino',o:'Hulotte',p:'Pince',m:'Mimosa',t:'Tarentule',s:'Spectre'};
const JD={b:[14,20],o:[14,17],p:[28,20],m:[18,20],t:[32,16],s:[14,20]};
const CAMN=['SCENE','COULOIR GAUCHE','COULOIR DROIT','CAVE DE PINCE','SALLE DES JOUETS','CONDUIT'];
const CALLS=[
"Allô ? Bienvenue, gardien ! Clique sur le bouton PORTE quand Bobino (clown) ou Hulotte (hibou) est devant. Pince rôde dans la Cave : surveille la caméra 4 !",
"Mimosa la poupée dort dans la Salle des jouets (caméra 5). Maintiens le bouton REMONTER pour que sa boîte à musique ne s'arrête jamais !",
"Tarentule se faufile dans les conduits (caméra 6). Si elle apparaît à la bouche d'aération, clique sur VENT pour la fermer !",
"Le Spectre apparaît parfois dans le bureau. Ouvre vite la caméra pour le faire fuir !",
"Dernière nuit. Ils sont tous là, et ils sont furieux. Bonne chance, gardien."
];
let save={night:1};
try{const s=JSON.parse(localStorage.getItem('cirque5'));if(s&&s.night)save=s;}catch(e){}
let mode='title',S=null,muted=false,T=0;
const PR={};
let regs=[],nr=[];

/* ================= AUDIO ================= */
let ac=null,mg=null,nb=null,buzzG=null;
function audioInit(){
 if(ac){if(ac.state==='suspended')ac.resume();return;}
 try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 mg=ac.createGain();mg.gain.value=muted?0:.7;mg.connect(ac.destination);
 const len=ac.sampleRate;nb=ac.createBuffer(1,len,ac.sampleRate);
 const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const hum=ac.createOscillator();hum.type='sawtooth';hum.frequency.value=55;
 const hg=ac.createGain();hg.gain.value=.025;
 const hf=ac.createBiquadFilter();hf.type='lowpass';hf.frequency.value=200;
 hum.connect(hf);hf.connect(hg);hg.connect(mg);hum.start();
 const bz=ac.createOscillator();bz.type='square';bz.frequency.value=120;
 buzzG=ac.createGain();buzzG.gain.value=0;bz.connect(buzzG);buzzG.connect(mg);bz.start();
}
function tone(f,d,type,v,slide,delay){
 if(!ac||muted)return;type=type||'square';v=v||.15;slide=slide||0;delay=delay||0;
 const t=ac.currentTime+delay;const o=ac.createOscillator(),gn=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
 gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(gn);gn.connect(mg);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,ff,type,delay){
 if(!ac||muted)return;v=v||.2;ff=ff||800;type=type||'lowpass';delay=delay||0;
 const t=ac.currentTime+delay;const s=ac.createBufferSource();s.buffer=nb;s.loop=true;
 const f=ac.createBiquadFilter();f.type=type;f.frequency.value=ff;
 const gn=ac.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f);f.connect(gn);gn.connect(mg);s.start(t);s.stop(t+d+.02);
}
const sDoor=()=>{noise(.25,.5,300);tone(70,.3,'sine',.4,-30);};
const sBang=()=>{noise(.4,.7,600);tone(60,.5,'sine',.5,-20);tone(120,.2,'square',.2);};
const sStep=()=>{tone(80,.12,'sine',.3,-30);noise(.08,.15,250);};
const sClick=()=>{tone(1200,.04,'square',.07);tone(700,.05,'square',.07,0,.05);};
const sLight=()=>tone(300,.05,'sawtooth',.08);
const sStab=()=>{tone(1500,.25,'sawtooth',.2,-900);noise(.2,.2,3000,'highpass');};
const sClank=()=>{tone(200,.3,'square',.2,-100);noise(.3,.3,2000,'bandpass');tone(150,.3,'triangle',.3,0,.15);};
const sBreath=()=>noise(.5,.12,700,'bandpass');
const sBabble=()=>tone(180+rnd(120),.08,'sawtooth',.04);
const sRing=()=>{for(let i=0;i<4;i++)tone(880,.1,'square',.1,0,i*.18);};
const sChime=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.7,'triangle',.25,0,i*.35));};
const sPow=()=>{tone(400,.8,'sawtooth',.2,-330);noise(.6,.3,500);};
const sBoing=()=>{tone(150,.5,'sine',.35,600);tone(900,.3,'square',.1,-500,.1);noise(.2,.2,1500,'bandpass');};
const sScratch=()=>{for(let i=0;i<4;i++)noise(.07,.2,3500,'highpass',i*.09);};
const sWhisper=()=>{noise(1.2,.22,2500,'bandpass');tone(500,1.2,'sine',.08,-250);tone(530,1.2,'sine',.06,-250,.05);};
function sScream(){
 for(let k=0;k<4;k++)tone(700+k*180,1.5,'sawtooth',.2,900+k*200);
 tone(120,1.5,'square',.25,300);noise(1.6,.55,1500,'bandpass');noise(1.2,.4,4000,'highpass');
 if(navigator.vibrate)try{navigator.vibrate([200,60,300,60,400]);}catch(e){}
}

/* ================= PIXEL FONT ================= */
const GL={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101111011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
'%':'101001010100101',':':'000010000010000','-':'000000111000000','.':'000000000000010','!':'010010010000010','?':'110001010000010','/':'001001010100100','^':'010111101000000',' ':'000000000000000'};
function txtW(s,sc){return s.length*4*sc-sc;}
function txt(s,x,y,sc,col,al,sh){
 s=String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
 sc=sc||1;col=col||'#fff';
 const w=txtW(s,sc);
 if(al==='c')x-=w/2;else if(al==='r')x-=w;
 x=Math.round(x);y=Math.round(y);
 for(let pass=sh===false?1:0;pass<2;pass++){
  const c=pass===0?'#000':col,ox=pass===0?sc:0;
  for(let i=0;i<s.length;i++){
   const gl=GL[s[i]]||GL[' '];
   for(let k=0;k<15;k++)if(gl[k]==='1')R(x+i*4*sc+(k%3)*sc+ox,y+((k/3)|0)*sc+ox,sc,sc,c);
  }
 }
}
/* Vrai bouton 3D cliquable */
function btn(id,x,y,w,h,label,o){
 o=o||{};
 const face=o.face||'#8a2a2a',edge=o.edge||'#4a1414',hi=o.hi||'#c85a5a';
 const pr=(PR[id]>0)||!!o.held;
 R(x-1,y-1,w+2,h+2,'#000');R(x,y,w,h,'#22222c');
 const fy=pr?y+3:y+1,fh=h-5;
 if(!pr)R(x+1,y+h-4,w-2,3,edge);
 R(x+1,fy,w-2,fh,face);R(x+1,fy,w-2,1,hi);R(x+1,fy,1,fh,hi);
 if(o.sel){g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x+1,fy,w-2,fh);}
 const sc=o.sc||1;
 txt(label,x+w/2,fy+Math.max(1,Math.floor((fh-5*sc)/2))-(o.lamp&&h>=20?3:0),sc,'#fff','c');
 if(o.lamp){
  if(h>=20){R(x+w/2-3,fy+fh-6,6,4,'#000');R(x+w/2-2,fy+fh-5,4,2,o.lamp);}
  else{R(x+w-6,fy+2,3,3,'#000');R(x+w-5,fy+3,1,1,o.lamp);}
 }
 nr.push({id,x,y,w,h,down:o.down,up:o.up});
}

/* ================= SPRITES ================= */
function mk(cx,cy,u){return(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(cx+x*u),Math.round(cy+y*u),Math.max(1,Math.round(w*u)),Math.max(1,Math.round(h*u)));};}
function head(type,cx,cy,u,o,bl){
 const P=mk(cx,cy,u);
 if(type==='b'){
  P(-3,-10,6,3,'#3a5bd9');P(-2,-12,4,2,'#3a5bd9');P(-1,-13,2,1.5,'#ffd23a');P(-4,-8,8,1,'#2a3fa0');
  P(-7,-7,14,14,'#e8e8f0');P(-7,6,14,1,'#aeaec0');P(-7,-7,1,14,'#c8c8d8');
  P(-6,0,2,2,'#e04a4a');P(4,0,2,2,'#e04a4a');
  P(-5,-4,4,o?5:4,'#111');P(1,-4,4,o?5:4,'#111');
  if(!bl){const c=o?'#ff2a2a':'#ffe14a';P(-4,-3,2,o?3:2,c);P(2,-3,2,o?3:2,c);}
  else{P(-5,-2,4,1,'#555');P(1,-2,4,1,'#555');}
  P(-1,0,2,2,'#e22');
  if(o){P(-5,3,10,4,'#300');P(-5,3,10,1,'#fff');P(-5,6,10,1,'#fff');for(let i=-4;i<5;i+=2)P(i,3,1,4,'#fff');}
  else{P(-4,4,1,1,'#a00');P(-3,5,6,1,'#a00');P(3,4,1,1,'#a00');}
 }else if(type==='o'){
  P(-7,-10,3,4,'#5a3a1c');P(4,-10,3,4,'#5a3a1c');
  P(-7,-7,14,14,'#8a5a2b');P(-6,-6,12,11,'#c99a5e');
  P(-6,-4,5,5,'#f3f3e0');P(1,-4,5,5,'#f3f3e0');
  if(!bl){const pc=o?'#d00':'#111';const s=o?3:2;P(-4,-3,s,s,pc);P(2,-3,s,s,pc);}
  else{P(-6,-2,5,1,'#5a3a1c');P(1,-2,5,1,'#5a3a1c');}
  P(-1,0,2,2,'#f5a623');
  if(o){P(-3,3,6,4,'#300');P(-3,3,6,1,'#fff');P(-1,2,2,1,'#f5a623');}
  else P(-1,2,2,1,'#c57e10');
  P(-5,5,2,1,'#6b4423');P(3,5,2,1,'#6b4423');P(-1,6,2,1,'#6b4423');
 }else if(type==='p'){
  P(-7,-12,2,6,'#c0392b');P(5,-12,2,6,'#c0392b');P(-8,-14,4,3,'#fff');P(4,-14,4,3,'#fff');
  if(!bl){const pc=o?'#d00':'#111';P(-7,-13,2,2,pc);P(5,-13,2,2,pc);}
  P(-9,-6,18,12,'#c0392b');P(-9,-6,18,1,'#e74c3c');P(-9,5,18,1,'#8e2a1f');
  P(-14,-12,5,5,'#e74c3c');P(-14,-12,2,3,'#c0392b');P(9,-12,5,5,'#e74c3c');P(12,-12,2,3,'#c0392b');
  P(-6,-4,4,1,'#400');P(2,-4,4,1,'#400');
  if(o){P(-6,0,12,5,'#300');for(let i=-6;i<6;i+=2){P(i,0,1,2,'#fff');P(i+1,3,1,2,'#fff');}}
  else{P(-4,2,8,1,'#611');}
 }else if(type==='m'){
  P(-8,-9,16,5,'#222');P(-9,-5,3,11,'#222');P(6,-5,3,11,'#222');P(-2,-11,4,2,'#d33');
  P(-7,-7,14,14,'#f3e6e0');P(-7,-7,14,3,'#222');
  P(-6,1,3,2,'#f08a8a');P(3,1,3,2,'#f08a8a');
  if(!bl){P(-5,-3,4,o?5:4,'#111');P(1,-3,4,o?5:4,'#111');P(-4,-3,1,1,'#fff');P(2,-3,1,1,'#fff');
   if(o){P(-4,-1,2,2,'#e22');P(2,-1,2,2,'#e22');}}
  else{P(-5,-1,4,1,'#555');P(1,-1,4,1,'#555');}
  P(2,-7,1,5,'#999');P(3,-3,2,1,'#999');
  if(o){P(-4,3,8,5,'#300');P(-4,3,8,1,'#fff');P(-4,7,8,1,'#fff');}else P(-2,4,4,1,'#b22');
 }else if(type==='t'){
  for(let k=0;k<4;k++){P(-16,-6+k*3,8,1,'#111');P(8,-6+k*3,8,1,'#111');}
  P(-8,-6,16,13,'#2a2a3a');P(-8,-6,16,1,'#3a3a4e');
  const ec=o?'#ff2020':'#d22';
  if(!bl){P(-6,-4,3,3,ec);P(3,-4,3,3,ec);P(-2,-5,1,2,ec);P(1,-5,1,2,ec);P(-1,-2,2,2,ec);}
  if(o){P(-5,2,10,5,'#400');P(-5,2,10,1,'#fff');P(-5,2,2,4,'#fff');P(3,2,2,4,'#fff');}
  else{P(-3,3,2,4,'#ddd');P(1,3,2,4,'#ddd');}
 }else{
  P(-7,-8,14,16,'#cfd8ff');P(-7,8,3,2,'#cfd8ff');P(-2,8,3,3,'#cfd8ff');P(3,8,3,2,'#cfd8ff');
  P(-7,-8,14,1,'#e8eeff');P(-7,-8,1,16,'#e8eeff');
  P(-5,-4,4,5,'#000');P(1,-4,4,5,'#000');
  if(!bl){const c=o?'#f00':'#8af';P(-4,-2,2,2,c);P(2,-2,2,2,c);}
  P(-3,3,6,o?6:2,'#000');
 }
}
function body(type,cx,by,u,t,o){
 const B=by+Math.round(Math.sin(t*5)*.4*u);
 const P=mk(cx,B,u);
 const col={b:['#6a4bd9','#4b33a3'],o:['#8a5a2b','#c99a5e'],p:['#c0392b','#8e2a1f']}[type];
 P(-4,-8,3,8,col[1]);P(1,-8,3,8,col[1]);P(-5,-1,4,1,'#111');P(1,-1,4,1,'#111');
 P(-6,-20,12,12,col[0]);
 if(type==='o')P(-3,-18,6,8,'#c99a5e');
 else if(type==='b'){P(-1,-19,2,2,'#ffd23a');P(-1,-15,2,2,'#ffd23a');P(-1,-11,2,2,'#ffd23a');}
 else P(-4,-18,8,2,col[1]);
 P(-9,-19,3,10,col[0]);P(6,-19,3,10,col[0]);
 if(type==='p'){P(-11,-24,5,5,'#e74c3c');P(6,-24,5,5,'#e74c3c');P(-11,-24,2,3,'#c0392b');P(9,-24,2,3,'#c0392b');}
 head(type,cx,B-28*u,u,o,((t*10)|0)%40===0);
}
function poly(p,c){g.fillStyle=c;g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fill();}
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
{const v=vig.getContext('2d');const gr=v.createRadialGradient(W/2,H*.5,50,W/2,H*.5,210);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.75)');v.fillStyle=gr;v.fillRect(0,0,W,H);}

/* ================= DRAW: HUD ================= */
function drawHud(){
 const h=Math.min(6,(S.t/HOUR)|0);
 txt('NUIT '+S.n,6,4,1,'#ddd');
 txt(HRS[h],6,12,2,'#fff');
 const pc=Math.ceil(S.power);
 txt('ENERGIE '+pc+'%',W-6,4,1,S.power<20?'#ff5a5a':'#7CFC7C','r');
 const use=S.use||1;
 txt('UTIL.',W-6-use*5-22,13,1,'#ddd');
 for(let i=0;i<use;i++)R(W-6-use*5+i*5,13,4,5,i<2?'#7CFC7C':(i<4?'#ffd23a':'#ff5a5a'));
}

/* ================= DRAW: OFFICE ================= */
function doorway(side){
 const x0=side==='L'?8:262,w=50,y0=28,hh=112;
 const lit=side==='L'?S.lL:S.lR;
 const ent=side==='L'?S.bob:S.owl;
 const door=side==='L'?S.aL:S.aR;
 g.save();g.beginPath();g.rect(x0,y0,w,hh);g.clip();
 R(x0,y0,w,hh,lit?'#6b6542':'#04040a');
 if(lit){R(x0+6,y0+20,w-12,hh-20,'#8a8250');R(x0,y0+88,w,24,'#3a3622');}
 const atDoor=ent.s===2;
 const pinHere=side==='L'&&S.pin.p===3&&S.pin.run>1.8;
 if(lit){
  if(atDoor)body(side==='L'?'b':'o',x0+25,140,3,T,0);
  else if(pinHere)body('p',x0+25,140,3,T,0);
 }else if(atDoor||pinHere){
  if(((T*6)|0)%7!==0){const c=pinHere&&!atDoor?'#ff3030':'#ffd23a';R(x0+15,y0+36,5,3,c);R(x0+30,y0+36,5,3,c);}
 }
 const dh=hh*door;
 if(dh>0){
  R(x0,y0,w,dh,'#4a4f5c');
  for(let i=0;i<dh;i+=10)R(x0,y0+i,w,1,'#3a3e4a');
  R(x0+4,y0+5,3,3,'#8a8f9c');R(x0+w-7,y0+5,3,3,'#8a8f9c');
  if(dh>6)for(let i=0;i<w;i+=8)R(x0+i,y0+dh-5,4,4,'#c9a227');

function startNight(n){
 audioInit();
 try{if('ontouchstart' in window){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}}catch(e){}
 const L=LV[n];
 S={n,t:0,power:100,dL:false,dR:false,lL:false,lR:false,vent:false,aL:0,aR:0,aV:0,cam:false,camId:1,camFlash:0,
  bob:{s:0,tm:rnd(3),dt:0,lvl:L.b},owl:{s:0,tm:rnd(3),dt:0,lvl:L.o},pin:{p:0,tm:0,run:0,st:0,lvl:L.p},
  mim:{lvl:L.m,e:100,out:false,ot:0,note:0,nt:0},
  spi:{lvl:L.t,v:0,tm:0,dt:0},
  spc:{lvl:L.s,tm:0,act:false,t:0,x:160,y:80},
  wind:false,use:1,js:null,black:false,bt:0,bTarget:7+rnd(8),callT:12,bab:0,breath:0,flick:0,lastNote:-1};
 mode='play';$('screen').style.display='none';
 showCall(CALLS[n-1]);sRing();
}
function showCall(txt){const m=$('msg');m.innerHTML=txt+'<small>(touche pour couper l\'appel)</small>';m.style.display='block';}
function hideCall(){$('msg').style.display='none';if(S)S.callT=0;}
$('msg').addEventListener('pointerdown',e=>{e.stopPropagation();hideCall();});
function ok(){return mode==='play'&&S&&!S.js&&!S.black&&!S.cam;}
function toggleDoor(side){if(!ok())return;if(side==='L')S.dL=!S.dL;else S.dR=!S.dR;sDoor();}
function toggleVent(){if(!ok())return;S.vent=!S.vent;sDoor();}
function toggleLight(side){
 if(!ok())return;
 const k=side==='L'?'lL':'lR';S[k]=!S[k];sLight();
 if(S[k]){const ent=side==='L'?S.bob:S.owl;
  if(ent.s===2||(side==='L'&&S.pin.p===3&&S.pin.run>1.8))sStab();}
}
function toggleCam(){
 if(mode!=='play'||!S||S.js||S.black)return;
 S.cam=!S.cam;S.camFlash=.2;S.wind=false;sClick();
 if(S.cam){hideCall();if(S.spc.act){S.spc.act=false;S.spc.tm=-2;}}
}
function selCam(i){if(!S||!S.cam)return;S.camId=i;S.camFlash=.15;sClick();}
function kill(type){
 if(!S||S.js)return;
 hideCall();S.cam=false;S.wind=false;S.js={type,t:0};sScream();
}
function blackout(){
 S.black=true;S.bt=0;S.bTarget=7+rnd(8);S.dL=S.dR=S.lL=S.lR=S.vent=false;S.cam=false;S.wind=false;
 S.aL=0;S.aR=0;S.aV=0;S.spc.act=false;sPow();hideCall();
}
function guard(a,side){
 const owl=a===S.owl,dt=S._dt;
 if(!a.lvl)return;
 if(a.s<2){
  a.tm+=dt;
  if(a.tm>=4.5){a.tm=0;
   const watched=owl&&S.cam&&S.camId===(a.s===0?1:3);
   if(!watched&&rnd(20)<a.lvl){a.s++;a.dt=0;sStep();}
  }
 }else{
  a.dt+=dt;const wait=Math.max(2.2,5.2-S.n*.45);
  if(a.dt>=wait){
   const cl=side==='L'?(S.dL&&S.aL>.7):(S.dR&&S.aR>.7);
   if(cl){sBang();a.s=rnd(2);a.tm=-2;a.dt=0;S.power=Math.max(0,S.power-1);}
   else kill(owl?'o':'b');
  }
 }
}
function pinStep(){
 const p=S.pin,dt=S._dt;if(!p.lvl)return;p.tm+=dt;
 if(p.p<3){
  if(p.tm>=6){p.tm=0;
   if(S.cam&&S.camId===4){if(p.p>0&&rnd(100)<40)p.p--;}
   else if(rnd(20)<p.lvl){p.p++;if(p.p===3){p.run=0;p.st=0;sClank();}}
  }
 }else{
  p.run+=dt;p.st-=dt;if(p.st<=0){p.st=.3;sStep();}
  if(p.run>=Math.max(2.4,3.6-S.n*.2)){
   const cl=S.dL&&S.aL>.7;
   if(cl){sBang();S.power=Math.max(0,S.power-6);p.p=1;p.tm=0;}
   else kill('p');
  }
 }
}
function mimStep(){
 const m=S.mim,dt=S._dt;if(!m.lvl)return;
 if(S.wind&&S.cam&&S.camId===5)m.e=Math.min(100,m.e+dt*45);
 else m.e=Math.max(0,m.e-dt*(2+m.lvl*.35));
 if(!m.out){
  m.nt-=dt;
  if(m.e>0&&m.nt<=0){m.nt=.5+(1-m.e/100)*.9;tone([523,659,784,659][m.note++%4],.25,'triangle',.05+((S.cam&&S.camId===5)?.1:0));}
  if(m.e<=0){m.out=true;m.ot=0;sBoing();}
 }else{
  m.ot+=dt;
  if(m.e>=25){m.out=false;sClick();}
  else if(m.ot>=Math.max(3,6.5-S.n*.4))kill('m');
 }
}
function spiStep(){
 const s=S.spi,dt=S._dt;if(!s.lvl)return;
 if(s.v<2){s.tm+=dt;if(s.tm>=5.5){s.tm=0;if(rnd(20)<s.lvl){s.v++;s.dt=0;sScratch();}}}
 else{
  s.dt+=dt;const wait=Math.max(2.6,5-S.n*.35);
  if(s.dt>=wait){
   if(S.vent&&S.aV>.7){sBang();s.v=0;s.tm=-3;S.power=Math.max(0,S.power-1);}
   else kill('t');
  }
 }
}
function spcStep(){
 const c=S.spc,dt=S._dt;if(!c.lvl)return;
 if(!c.act){c.tm+=dt;if(c.tm>=7){c.tm=0;if(!S.cam&&rnd(20)<c.lvl){c.act=true;c.t=0;c.x=80+rnd(160);c.y=60+rnd(30);sWhisper();}}}
 else{c.t+=dt;if(c.t>=Math.max(3.5,6-S.n*.4))kill('s');}
}
function update(dt){
 if(S.js){S.js.t+=dt;if(S.js.t>1.9)gameOver();return;}
 S.t+=dt;S._dt=dt;
 for(const k in PR)if(PR[k]>0)PR[k]-=dt;
 if(S.t>=HOUR*6){win();return;}
 if(S.camFlash>0)S.camFlash-=dt;
 const use=1+(S.dL?1:0)+(S.dR?1:0)+(S.lL?1:0)+(S.lR?1:0)+(S.vent?1:0)+(S.cam?1:0);
 S.use=use;
 if(!S.black){
  S.power-=use*.1*(1+(S.n-1)*.07)*dt;
  if(S.power<=0){S.power=0;blackout();}
 }
 const sp=dt*4;
 S.aL=S.dL?Math.min(1,S.aL+sp):Math.max(0,S.aL-sp);
 S.aR=S.dR?Math.min(1,S.aR+sp):Math.max(0,S.aR-sp);
 S.aV=S.vent?Math.min(1,S.aV+sp):Math.max(0,S.aV-sp);
 if(buzzG)buzzG.gain.value=((S.lL||S.lR)&&!muted)?.04:0;
 if(S.black){
  S.bt+=dt;const n=(S.bt/.55)|0;
  if(n!==S.lastNote){S.lastNote=n;const m=[392,494,587,494,392,330,392,0];const f=m[n%m.length];if(f)tone(f,.5,'triangle',.18);}
  if(S.bt>=S.bTarget)kill('b');
  return;
 }
 guard(S.bob,'L');if(S.js)return;
 guard(S.owl,'R');if(S.js)return;
 pinStep();if(S.js)return;
 mimStep();if(S.js)return;
 spiStep();if(S.js)return;
 spcStep();if(S.js)return;
 S.breath-=dt;
 if((S.bob.s===2||S.owl.s===2)&&S.breath<=0){S.breath=1.6;sBreath();}
 if(S.callT>0){S.callT-=dt;S.bab-=dt;if(S.bab<=0){S.bab=.09;sBabble();}if(S.callT<=0)hideCall();}
 S.flick=Math.max(0,S.flick-dt);if(Math.random()<.002)S.flick=.15;
}
function showScreen(html){const s=$('screen');s.innerHTML=html;s.style.display='flex';}
function gameOver(){
 mode='dead';const t=S.js.type,n=S.n;
 showScreen('<h2>'+NAMES[t]+' t\'a eu...</h2><p>Tu n\'as pas survécu à la nuit '+n+'.</p>'
  +'<button class="btn" id="rt">↺ RÉESSAYER LA NUIT '+n+'</button><button class="btn sm" id="mn">MENU</button>');
 $('rt').onclick=()=>startNight(n);$('mn').onclick=showTitle;
}
function win(){
 mode='win';const n=S.n;sChime();hideCall();
 const last=n>=5;
 if(!last&&save.night<n+1)save.night=n+1;
 if(last)save.night=Math.max(save.night,5);
 try{localStorage.setItem('cirque5',JSON.stringify(save));}catch(e){}
 if(last){
  showScreen('<h1>6 AM</h1><h2>VICTOIRE !</h2><p>Tu as survécu aux 5 nuits au Cirque Mécanique. Les automates se sont rendormis... pour l\'instant.</p><button class="btn" id="mn">MENU PRINCIPAL</button>');
  $('mn').onclick=showTitle;
 }else{
  showScreen('<h1>6 AM</h1><h2>Nuit '+n+' survivée !</h2><p>Le soleil se lève. Prépare-toi pour la suite...</p><button class="btn" id="nx">▶ NUIT '+(n+1)+'</button><button class="btn sm" id="mn">MENU</button>');
  $('nx').onclick=()=>startNight(n+1);$('mn').onclick=showTitle;
 }
}
function showTitle(){
 mode='title';S=null;regs=[];
 $('msg').style.display='none';
 if(buzzG)buzzG.gain.value=0;
 showScreen('<h1>5 NUITS AU CIRQUE MÉCANIQUE</h1>'
  +'<p>Survis de minuit à 6 h face à 6 monstres. Clique sur les vrais boutons du bureau : portes, lumières, ventilation et caméra.</p>'
  +'<button class="btn" id="go">▶ CONTINUER — NUIT '+save.night+'</button>'
  +'<button class="btn" id="nw">NOUVELLE PARTIE</button>'
  +'<button class="btn sm" id="sn">🔊 SON : '+(muted?'OFF':'ON')+'</button>');
 $('go').onclick=()=>startNight(save.night);
 $('nw').onclick=()=>{save.night=1;try{localStorage.setItem('cirque5',JSON.stringify(save));}catch(e){}startNight(1);};
 $('sn').onclick=()=>{audioInit();muted=!muted;if(mg)mg.gain.value=muted?0:.7;$('sn').textContent='🔊 SON : '+(muted?'OFF':'ON');};
}

/* ================= INPUT ================= */
const holds=new Map();
function toC(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();audioInit();
 if(mode!=='play')return;
 const p=toC(e);
 for(let i=regs.length-1;i>=0;i--){
  const r=regs[i];
  if(p[0]>=r.x&&p[0]<=r.x+r.w&&p[1]>=r.y&&p[1]<=r.y+r.h){
   PR[r.id]=.15;if(r.down)r.down();holds.set(e.pointerId,r);break;
  }
 }
});
function rel(e){const r=holds.get(e.pointerId);if(r){if(r.up)r.up();holds.delete(e.pointerId);}}
window.addEventListener('pointerup',rel);window.addEventListener('pointercancel',rel);
window.addEventListener('keydown',e=>{
 if(mode!=='play'||!S||e.repeat)return;
 const k=e.key.toLowerCase();
 if(k==='a')toggleDoor('L');else if(k==='d')toggleDoor('R');
 else if(k==='q')toggleLight('L');else if(k==='e')toggleLight('R');
 else if(k==='v')toggleVent();
 else if(k===' '){e.preventDefault();toggleCam();}
 else if(k==='r'){if(S.cam)S.wind=true;}
 else if('123456'.includes(k)&&k)selCam(+k);
});
window.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='r'&&S)S.wind=false;});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= LOOP ================= */
let last=0;
function loop(ts){
 const dt=Math.min(.1,(ts-last)/1000||0);last=ts;T+=dt;
 if(mode==='play'&&S){if(!document.hidden)update(dt);if(mode==='play'&&S)drawPlay();}
 else if(mode==='title')drawTitle();
 else if(mode==='dead')drawDead();
 else if(mode==='win')drawWin();
 requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
})();
</script>
